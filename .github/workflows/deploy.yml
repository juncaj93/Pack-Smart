name: Deploy

# Push to main deploys to production (technical-docs/01_ARCHITECTURE.md §2).
#
# MERGING TO main IS THEREFORE A PRODUCTION DEPLOY. Per CLAUDE.md, that merge
# needs Alex's explicit approval — this workflow does not soften that, it is the
# mechanism that makes it true.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID
#
# Worker secrets (AUTH_PASSPHRASE_HASH, SESSION_SECRET) are NOT set here. They
# are set once by Alex with `wrangler secret put` and never pass through CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, because this repository is PUBLIC (exposure audit, 2026-08-06).
#
# A top-level block makes every permission this does not name `none`, so the
# token handed to `actions/checkout` can read the repository and do nothing
# else. On a public repository a pull request from a fork already receives a
# read-only token that GitHub refuses to attach secrets to — this writes that
# guarantee down rather than inheriting it, so a later change to the
# repository-wide default cannot quietly widen what these jobs can do.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Never ship something that does not typecheck or pass its tests.
      - run: npm run typecheck
      - run: npm test

      - name: Guard against shipping local dev secrets
        # .dev.vars is gitignored and dist/client/.assetsignore excludes it, but
        # this fails loudly rather than relying on both of those staying true.
        run: |
          if [ -f .dev.vars ]; then
            echo "::error::.dev.vars present in a deploy build — refusing."
            exit 1
          fi

      - run: npm run build

      # A STANDING GUARD, not leftover scaffolding.
      #
      # During the #33 swipe hotfix a preview build carried a branch that skipped
      # the passphrase, so the gesture could be checked on a phone without typing
      # one. That code is gone — but the reason to check is not, because the
      # failure it guards against is silent: a Worker that authenticates nobody
      # looks completely normal to anyone already signed in, and would put Alex's
      # trips on a public URL behind nothing.
      #
      # Both markers cost one grep and would have caught that class of mistake
      # before it reached production, so they stay whether or not anything
      # currently emits them.
      - name: Refuse to deploy a Worker that skips the passphrase
        run: |
          if grep -rq "pack-smart-preview-no-passphrase" dist/pack_smart/; then
            echo "::error::the built Worker carries a passphrase bypass — refusing to deploy."
            exit 1
          fi
          if grep -rq "pack-smart-gesture-diagnostics" dist/client/assets/; then
            echo "::error::the client bundle carries preview diagnostics — refusing to deploy."
            exit 1
          fi

      # Schema changes reach production before the code that depends on them.
      # Forward-only; a destructive migration requires explicit approval (CLAUDE.md).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pack-smart --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # What a repairing migration actually did to production, in the log.
      #
      # Production cannot be inspected from the agent environment — outbound
      # HTTPS is gated by network policy — so a migration that repairs rows has
      # no way to report what it repaired, and "0013 applied successfully" is not
      # the same statement as "it merged 4 duplicate rows across 2 items".
      #
      # Migrations that repair anything write a `migration_<n>` row into
      # `preference`; this prints every one of them. Never fails the deploy: a
      # missing row means no migration had anything to report, which is the
      # normal case.
      - name: Record what the migrations repaired
        continue-on-error: true
        run: |
          npx wrangler d1 execute pack-smart --remote --json \
            --command "SELECT key, value_json FROM preference WHERE key LIKE 'migration_%' ORDER BY key" \
            || echo "no migration audit rows to report"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
