name: Retire preview URLs

# TURNS OFF WORKER VERSION PREVIEW URLS FOR THE WHOLE WORKER, and then proves
# anonymously that the specific URL Alex opened no longer serves the app.
#
# WHY THIS IS THE RIGHT LEVER. A version preview URL is public and permanent:
# every version uploaded by `wrangler versions upload` keeps its own
# `<version>-pack-smart.<subdomain>.workers.dev` address for as long as the
# version exists. Wrangler 4.115 has no `versions delete`, and uploading a
# corrected version does NOT retract an earlier one — so removing the bypass
# from the code fixes every FUTURE preview and does nothing about the one
# already published. Only the Worker-level setting reaches back over versions
# already uploaded.
#
# `previews_enabled: false` on the script's subdomain is that setting. It is
# enforced by Cloudflare, not by the URL being hard to guess, which is what
# "do not rely on obscurity" requires.
#
# THE ONE DANGEROUS FIELD. The same endpoint carries `enabled`, which is whether
# the Worker answers on workers.dev AT ALL. Production is served from
# `pack-smart.<subdomain>.workers.dev`, so writing `enabled: false` here would
# take Pack Smart offline. This reads the current settings first and writes back
# the value it read, changing only `previews_enabled` — and refuses to write
# anything if the read did not succeed.
on:
  workflow_dispatch:
  push:
    branches: ['claude/packing-list-swipe-hotfix-f8wi7r']

concurrency:
  group: retire-preview
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Read the current workers.dev settings
        id: read
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pack-smart/subdomain"
          curl -sS -X GET "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" -o read.json
          cat read.json

          if [ "$(jq -r '.success' read.json)" != "true" ]; then
            echo "::error::could not read the workers.dev settings — refusing to write blind."
            exit 1
          fi

          enabled=$(jq -r '.result.enabled' read.json)
          if [ "$enabled" != "true" ] && [ "$enabled" != "false" ]; then
            echo "::error::workers.dev 'enabled' read back as '$enabled' — refusing to guess."
            exit 1
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Currently: enabled=$enabled previews_enabled=$(jq -r '.result.previews_enabled' read.json)"

      - name: Turn version preview URLs off
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLED: ${{ steps.read.outputs.enabled }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pack-smart/subdomain"
          # `enabled` is echoed back exactly as read — only previews_enabled changes.
          curl -sS -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"enabled\": ${ENABLED}, \"previews_enabled\": false}" -o write.json
          cat write.json

          if [ "$(jq -r '.success' write.json)" != "true" ]; then
            echo "::error::failed to disable version preview URLs."
            exit 1
          fi

      - name: Confirm the setting stuck
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pack-smart/subdomain"
          curl -sS -X GET "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" -o after.json
          cat after.json

          if [ "$(jq -r '.result.previews_enabled' after.json)" != "false" ]; then
            echo "::error::previews_enabled did not read back as false."
            exit 1
          fi
          if [ "$(jq -r '.result.enabled' after.json)" != "true" ]; then
            echo "::error::workers.dev is no longer enabled — production may be offline. Investigate."
            exit 1
          fi
          echo "previews_enabled=false, workers.dev still enabled."

      - name: Prove the preview URL is anonymously dead
        # No cookies, no token, no secrets on this request — the same thing a
        # stranger with the link would send. Retried, because the setting
        # propagates through Cloudflare's edge rather than taking effect in the
        # same millisecond the API returns.
        run: |
          set -uo pipefail
          url="https://c1283662-pack-smart.juncaj93.workers.dev"
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 "$url/api/trips" || echo 000)
            shell=$(curl -sS -o shell.txt -w '%{http_code}' --max-time 20 "$url/" || echo 000)
            echo "attempt $attempt: /api/trips -> $code, / -> $shell"
            if [ "$code" != "200" ] && [ "$shell" != "200" ]; then
              echo "Preview no longer serves the application anonymously."
              head -c 400 body.txt || true
              exit 0
            fi
            sleep 15
          done
          echo "::error::the preview URL still answered 200 after 20 attempts — it is STILL EXPOSED."
          exit 1

      - name: Prove production is untouched
        # The other half of the safety claim. Disabling preview URLs must not
        # have taken the real app down with them.
        run: |
          set -uo pipefail
          url="https://pack-smart.juncaj93.workers.dev"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url/api/trips" || echo 000)
          echo "production /api/trips (anonymous) -> $code"
          if [ "$code" != "401" ]; then
            echo "::error::production did not answer 401 to an anonymous request. Investigate before merging."
            exit 1
          fi
          echo "Production is up and still requires a session."
