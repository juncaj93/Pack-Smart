name: CI

# Every branch used to run CI twice — once for the push, once for the pull
# request opened on the same commit — which doubled a ~7 minute run for no extra
# signal and made "one of the two jobs failed" a sentence anyone could write. A
# branch is covered by its pull request; `main` is covered by the push it gets on
# merge.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was still running for the same ref, so a fix
# pushed on top of a bad commit does not queue behind eight minutes of WebKit
# that nobody is going to read.
# Least privilege, because this repository is PUBLIC (exposure audit, 2026-08-06).
#
# A top-level block makes every permission this does not name `none`, so the
# token handed to `actions/checkout` can read the repository and do nothing
# else. On a public repository a pull request from a fork already receives a
# read-only token that GitHub refuses to attach secrets to — this writes that
# guarantee down rather than inheriting it, so a later change to the
# repository-wide default cannot quietly widen what these jobs can do.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI proves the code is internally consistent. It does NOT prove a milestone is
# complete: technical-docs/06_RISK_REGISTER.md R11 is explicit that CI cannot run
# iOS Safari, and the manual iPhone checklist is required before any milestone is
# called done.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # Explicit, even though Playwright's webServer also builds. A broken
        # build should fail as a build failure, not as a webServer timeout
        # buried in the e2e step.
        run: npm run build

      - name: Install WebKit
        # WebKit only — the approved e2e target. Chromium is not installed, so a
        # silent fallback to it is impossible.
        run: npx playwright install --with-deps webkit

      - name: End-to-end tests (WebKit @ 390x844)
        run: npx playwright test --project=iphone-webkit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
