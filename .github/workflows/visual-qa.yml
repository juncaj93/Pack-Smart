name: Visual QA

# The evidence half of the UX gate (AUTONOMY.md §3, VISUAL_ACCEPTANCE.md).
#
# `ci.yml` proves the code is consistent with itself. This proves the screens are
# finished: it seeds the real wardrobe and five trips, walks every surface at four
# widths, asserts the measurable rules, and uploads the screenshots so a review is
# grounded in images rather than claims.
#
# Chromium at iPhone metrics, not WebKit. WebKit is the approved correctness target
# and `ci.yml` runs it; this run is about layout, density and touch geometry, which
# are the same in both engines and cheap to install here.

# One run per commit, not two. This used to fire on the push AND on the pull
# request opened at the same commit, which is where "one of the two visual jobs"
# came from — two identical runs, and no way to tell a real difference between
# them from a flake. A branch is covered by its pull request; `main` by the push
# it gets on merge.
#
# `ready_for_review` matches `ci.yml`: the four-minute Chromium walk is skipped
# while a pull request is a draft, and marking it ready is what fires the run
# that the release candidate is actually judged on.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege, because this repository is PUBLIC (exposure audit, 2026-08-06).
#
# A top-level block makes every permission this does not name `none`, so the
# token handed to `actions/checkout` can read the repository and do nothing
# else. On a public repository a pull request from a fork already receives a
# read-only token that GitHub refuses to attach secrets to — this writes that
# guarantee down rather than inheriting it, so a later change to the
# repository-wide default cannot quietly widen what these jobs can do.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same test as `ci.yml`, for the same reason: a screenshot of a screen
      # no commit touched is four minutes proving nothing.
      - name: What changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base...HEAD"                | grep -qvE '^(product-docs/|technical-docs/|[^/]*\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation only — the visual walk is skipped for this head."
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true

      - name: Cache the Chromium build
        if: steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true
        run: npx playwright install --with-deps chromium

      - name: Visual and interaction QA
        if: steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true
        run: npm run qa:visual

      - name: Upload screenshots and the gate report
        # Always: an accepted release needs its evidence just as much as a
        # rejected one, and the report names every violation rather than only the
        # first.
        if: always() && steps.changed.outputs.docs_only != 'true' && github.event.pull_request.draft != true
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: |
            .visual/
            !.visual/state.json
          retention-days: 14
