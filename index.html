<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover is load-bearing: without it every env(safe-area-inset-*)
      resolves to 0 and the bottom nav sits under the home indicator.
      user-scalable is left alone — pinch zoom stays available for accessibility;
      focus zoom is prevented by the 16px input floor in global.css instead.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Pack Smart</title>
    <meta name="description" content="A calm personal travel assistant that already knows how Alex packs." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Installed Home Screen behavior (iOS reads these, not the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pack Smart" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      iOS ignores manifest icons when adding to the Home Screen and reads only
      this link. Omitting it produces a screenshot thumbnail instead of an icon.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      No `media` attribute: `applyAppearance` rewrites this one to match the
      resolved theme, so Safari's chrome follows Alex's choice rather than the
      phone's. Two media-scoped tags could not be overridden.
    -->
    <meta name="theme-color" content="#f7f7f8" />

    <!--
      Sets the theme BEFORE the first paint.
      ======================================

      This is a classic script, not a module, and it is inline. Both matter. A
      module is deferred by definition, so it runs after the document has been
      parsed and painted — which is precisely one frame of white on a phone in
      Dark, every single launch. That flash is the whole reason this exists, and
      the only way to avoid it is to run before the body renders.

      It is a deliberate duplicate of `resolveAppearance` in
      `src/lib/appearance.ts`, and `tests/unit/dom/appearance.test.ts` reads both
      real files and fails if they disagree about the key, the attribute, or the
      three allowed values. A duplicate that is checked is safer here than an
      import that would arrive too late to be useful.

      Everything is wrapped in try/catch: localStorage throws rather than
      returning null in private browsing, and a colour preference must never be
      able to stop the app loading.
    -->
    <script>
      (function () {
        try {
          var stored = null
          try {
            stored = localStorage.getItem('pack-smart.appearance')
          } catch (e) {
            /* Storage unavailable — fall through to the device setting. */
          }
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var resolved =
            choice === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : choice
          document.documentElement.setAttribute('data-theme', resolved)
          var meta = document.querySelector('meta[name="theme-color"]:not([media])')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0b0b0c' : '#f7f7f8')
        } catch (e) {
          /* Any failure leaves the stylesheet's own default in charge. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
